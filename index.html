<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Runner</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;margin:0;background:#16161f;color:#fff;font-family:-apple-system,"PingFang SC",Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:10px 10px 0}
#game{position:relative;width:100%;border-radius:16px;overflow:hidden;touch-action:none;background:#222}
#game canvas{display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:10px 14px;font-size:16px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,15,30,.5);text-align:center;padding:16px}
.ov .big{font-size:52px;line-height:1.1}
.ov h2{font-size:22px;margin:4px 0 10px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.ov p{font-size:15px;margin:0 0 16px;line-height:1.6}
.lab{font-size:13px;opacity:.85;margin:6px 0 6px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;max-width:330px;margin-bottom:6px}
.chips button{font-size:15px;padding:10px 6px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:rgba(20,20,40,.55);color:#fff;cursor:pointer}
.chips button.on{border-color:#ff7a45;background:rgba(255,122,69,.85)}
.go{margin-top:12px;font-size:18px;font-weight:600;padding:13px 44px;border:none;border-radius:999px;background:#ff7a45;color:#fff;cursor:pointer}
.go2{margin-top:10px;font-size:15px;padding:10px 26px;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;background:rgba(20,20,40,.5);color:#fff;cursor:pointer}
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px}
.pad button{width:78px;height:78px;border-radius:50%;border:none;background:#34343f;touch-action:none;display:flex;align-items:center;justify-content:center}
.pad button.on{background:#ff7a45}
#bj{width:92px;height:92px;background:#ff7a45}
#bj.on{background:#ffb08c}
.pad svg{width:30px;height:30px;fill:#fff;pointer-events:none}
.hint{font-size:12px;color:#9a9aa8;text-align:center;margin-top:8px}
</style>
</head>

</div>
<div class="hint">Swipe left or right to switch lanes, swipe up to jump. Arrow keys work on a computer.</div>
</div>
<script>
const SCREAM_SR = 22050;
let SCREAM_SAMPLES = null;
function screamGen(arr, dur, fFn, envFn) {
  const n = Math.floor(SCREAM_SR * dur);
  let ph = 0;
  for (let i = 0; i < n; i++) {
    const t = i / SCREAM_SR;
    ph += 2 * Math.PI * fFn(t) / SCREAM_SR;
    arr.push(Math.sign(Math.sin(ph)) * 0.25 * (envFn ? envFn(t) : 1));
  }
}
function screamSq(arr, f, dur, vib, glideTo) {
  screamGen(arr, dur, t => {
    let fr = glideTo ? f * Math.pow(glideTo / f, t / dur) : f;
    return fr * (1 + vib * Math.sin(2 * Math.PI * 9 * t));
  }, glideTo ? t => Math.min(1, (dur - t) * 3) : null);
}
function screamSil(arr, d) { for (let i = 0; i < Math.floor(SCREAM_SR * d); i++) arr.push(0); }
function screamWav(s) {
  const b = new ArrayBuffer(44 + s.length * 2);
  const v = new DataView(b);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + s.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, SCREAM_SR, true); v.setUint32(28, SCREAM_SR * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data');
  v.setUint32(40, s.length * 2, true);
  for (let i = 0; i < s.length; i++) v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s[i])) * 32767, true);
  return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
}
function buildScream() {
  const a = [];
  [523, 659, 784].forEach(f => { screamSq(a, f, 0.16, 0.02); screamSil(a, 0.04); });
  let g = 0.03;
  for (let i = 0; i < 14; i++) { screamSq(a, 784, 0.05, 0); screamSil(a, g); g *= 0.88; }
  [523, 587, 659, 698, 784, 880, 988, 1047, 1175, 1319, 1568].forEach(f => screamSq(a, f, 0.06, 0));
  screamGen(a, 2.0, t => 900 + 300 * Math.sin(2 * Math.PI * 3 * t) * (1 + t) + 40 * Math.sin(2 * Math.PI * 11 * t));
  let seed = 7;
  const r = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let i = 0; i < 22; i++) screamSq(a, 200 + r() * 1800, 0.03, 0);
  screamSil(a, 0.08);
  [1047, 1047, 1047].forEach(f => { screamSq(a, f, 0.08, 0.04); screamSil(a, 0.03); });
  screamSq(a, 1047, 1.6, 0.07, 180);
  screamSil(a, 0.08);
  for (let i = 0; i < 4; i++) { screamSq(a, 1568, 0.06, 0); screamSil(a, 0.05); }
  SCREAM_SAMPLES = a;
  return screamWav(a);
}
const SCREAM_URL = buildScream();
const SONG_INTRO = (() => { const a = []; [523, 659, 784].forEach(f => { screamSq(a, f, 0.16, 0.02); screamSil(a, 0.04); }); return a; })();
function songBeeps(n) { const a = []; let g = 0.03; for (let i = 0; i < n; i++) { screamSq(a, 784, 0.05, 0); screamSil(a, i < 14 ? g : Math.max(g, 0.012)); g *= 0.88; } return a; }
const SONG_TAIL = (() => {
  const a = [];
  [523, 587, 659, 698, 784, 880, 988, 1047, 1175, 1319, 1568].forEach(f => screamSq(a, f, 0.06, 0));
  screamGen(a, 2.0, t => 900 + 300 * Math.sin(2 * Math.PI * 3 * t) * (1 + t) + 40 * Math.sin(2 * Math.PI * 11 * t));
  let seed = 7;
  const r = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let i = 0; i < 22; i++) screamSq(a, 200 + r() * 1800, 0.03, 0);
  screamSil(a, 0.08);
  [1047, 1047, 1047].forEach(f => { screamSq(a, f, 0.08, 0.04); screamSil(a, 0.03); });
  screamSq(a, 1047, 1.6, 0.07, 180);
  screamSil(a, 0.08);
  for (let i = 0; i < 4; i++) { screamSq(a, 1568, 0.06, 0); screamSil(a, 0.05); }
  return a;
})();
const SILENT_URL = screamWav(new Array(2205).fill(0));
const EAT_SAMPLES = songBeeps(14);
const BEEP_A = SONG_INTRO.length / SCREAM_SR, BEEP_B = (SONG_INTRO.length + EAT_SAMPLES.length) / SCREAM_SR;
let actx = null, bgmSrc = null, eatSrc = null, keepAlive = null, master = null, bgmGain = null, musicOn = false, bgmBuf = null, eatBuf = null;
let bgmT0 = 0, bgmOff0 = 0, pausedOff = 0;
function audioInit() {
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC();
      master = actx.createGain(); master.gain.value = 0.8; master.connect(actx.destination);
      bgmGain = actx.createGain(); bgmGain.gain.value = 0.75; bgmGain.connect(master);
      bgmBuf = actx.createBuffer(1, SCREAM_SAMPLES.length, SCREAM_SR); bgmBuf.getChannelData(0).set(SCREAM_SAMPLES);
      eatBuf = actx.createBuffer(1, EAT_SAMPLES.length, SCREAM_SR); eatBuf.getChannelData(0).set(EAT_SAMPLES);
      keepAlive = new Audio(SILENT_URL); keepAlive.loop = true;
    }
    if (actx.state !== 'running') actx.resume();
    const pr = keepAlive.play(); if (pr && pr.catch) pr.catch(() => {});
  } catch (e) {}
}
function bgmDur() { return SCREAM_SAMPLES.length / SCREAM_SR; }
function startBgmAt(off) {
  try {
    const src = actx.createBufferSource(); src.buffer = bgmBuf; src.loop = true; src.connect(bgmGain);
    src.start(0, off); bgmSrc = src; bgmT0 = actx.currentTime; bgmOff0 = off;
  } catch (e) {}
}
function bgmNow() { return (bgmOff0 + actx.currentTime - bgmT0) % bgmDur(); }
function stopScream() {
  musicOn = false;
  const s = bgmSrc; bgmSrc = null; try { if (s) s.stop(); } catch (e) {}
  const e2 = eatSrc; eatSrc = null; try { if (e2) e2.stop(); } catch (e) {}
}
function playScream() { audioInit(); stopScream(); musicOn = true; startBgmAt(0); }
function resumeBgm() {
  if (!musicOn || bgmSrc) return;
  let off = pausedOff;
  if (off >= BEEP_A && off < BEEP_B) off = BEEP_B;
  startBgmAt(off);
}
function playEat() {
  try {
    if (!actx || !eatBuf || !musicOn) return;
    if (bgmSrc) { pausedOff = bgmNow(); const s = bgmSrc; bgmSrc = null; try { s.stop(); } catch (e) {} }
    const src = actx.createBufferSource(); src.buffer = eatBuf; src.connect(master);
    src.onended = () => { if (eatSrc === src) { eatSrc = null; resumeBgm(); } };
    const old = eatSrc; eatSrc = src; try { if (old) old.stop(); } catch (e) {}
    src.start();
  } catch (e) {}
}

 const b=mesh(new THREE.SphereGeometry(.42,16,12),blk,0,.6,0);b.scale.set(1,1.3,.95);g.add(b);const be=mesh(new THREE.SphereGeometry(.34,16,12),wht,0,.55,-.15);be.scale.set(1,1.25,.7);g.add(be);
 for(const s of [-1,1]){g.add(mesh(new THREE.SphereGeometry(.07,8,6),wht,s*.13,.98,-.32),mesh(new THREE.SphereGeometry(.035,8,6),blk,s*.13,.98,-.38));const f=mesh(new THREE.SphereGeometry(.2,10,8),blk,s*.42,.6,0);f.scale.set(.25,1,.55);g.add(f);w.push([f,'z',.35,14,s>0?0:Math.PI]);const ft=mesh(new THREE.BoxGeometry(.18,.06,.26),org,s*.15,.03,-.08);g.add(ft)}
 const bk=mesh(new THREE.ConeGeometry(.07,.2,6),org,0,.88,-.45);bk.rotation.x=-Math.PI/2;g.add(bk);return {g,w}}}
};


function labelTex(text,bg,fg,w,h,size){const c=document.createElement('canvas');c.width=w||256;c.height=h||128;const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);x.fillStyle=fg;let sz=size||46;const F=()=>x.font='bold '+sz+'px Arial,"Helvetica Neue",sans-serif';F();while(x.measureText(text).width>c.width*.88&&sz>12){sz-=2;F()}x.textAlign='center';x.textBaseline='middle';x.fillText(text,c.width/2,c.height/2+2);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
const TM=t=>new THREE.MeshBasicMaterial({map:t});
const emoCache={};
function labelSprite(e,txt){const k=e+txt;if(!emoCache[k]){const c=document.createElement('canvas');c.width=128;c.height=176;const x=c.getContext('2d');x.textAlign='center';x.textBaseline='middle';x.font='88px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.fillText(e,64,58);x.font='bold 34px Arial,"Helvetica Neue",sans-serif';x.lineWidth=8;x.strokeStyle='#7a4a00';x.strokeText(txt,64,142);x.fillStyle='#ffe066';x.fillText(txt,64,142);const t=new THREE.CanvasTexture(c);emoCache[k]=new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false})}const sp=new THREE.Sprite(emoCache[k]);sp.scale.set(.85,1.17,1);return sp}
function emojiSprite(e){if(!emoCache[e]){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.font='96px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,64,70);const t=new THREE.CanvasTexture(c);emoCache[e]=new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false})}const sp=new THREE.Sprite(emoCache[e]);sp.scale.set(.85,.85,.85);return sp}
function labelBox(w,h,d,sideC,text,bg,fg,size){const side=L(sideC),face=TM(labelTex(text,bg,fg,256,Math.round(256*h/w),size));return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[side,side,side,side,face,face])}
function gate(postC,boardText,boardBg,boardFg,barC){const m=new THREE.Group(),pm=L(postC);for(const s of [-1,1])m.add(mesh(new THREE.BoxGeometry(.16,2.3,.16),pm,s*.88,1.15,0));
 const bd=labelBox(1.9,.75,.08,boardBg,boardText,boardBg,boardFg,64);bd.position.y=1.85;m.add(bd);const bar=labelBox(1.8,.22,.1,barC,'',barC,barC);bar.position.y=.7;m.add(bar);const bar2=bar.clone();bar2.position.y=1.15;m.add(bar2);return m}
function spinner(inner){const g=new THREE.Group();g.add(inner);return g}
function coin(text,c1,c2){const t=TM(labelTex(text,c1,c2,128,128,70)),side=L(0xd9a400);const m=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.07,24),[side,t,t]);m.rotation.x=Math.PI/2;return spinner(m)}
function sheet(w,h,text,bg,fg,size){const f=TM(labelTex(text,bg,fg,256,Math.round(256*h/w),size)),e=L(0xffffff);return spinner(new THREE.Mesh(new THREE.BoxGeometry(w,h,.02),[e,e,e,e,f,f]))}

function human(o){const g=new THREE.Group(),w=[],skin=L(0xf2c9a5),top=L(o.top),bot=L(o.bottom),hair=L(o.hair),shoe=L(0x2a2a2e);
 for(const s of [-1,1]){const hip=new THREE.Group();hip.position.set(s*.12,.46,0);hip.add(mesh(new THREE.BoxGeometry(.17,.4,.19),bot,0,-.2,0),mesh(new THREE.BoxGeometry(.18,.08,.24),shoe,0,-.42,-.02));g.add(hip);w.push([hip,'x',.7,14,s>0?Math.PI:0]);
  const sh=new THREE.Group();sh.position.set(s*.33,.92,0);sh.add(mesh(new THREE.BoxGeometry(.13,.42,.15),top,0,-.2,0),mesh(new THREE.SphereGeometry(.07,8,6),skin,0,-.44,0));g.add(sh);w.push([sh,'x',.7,14,s>0?0:Math.PI]);
  if(o.glasses)g.add(mesh(new THREE.TorusGeometry(.06,.012,6,16),L(0x222222),s*.09,1.24,-.235))}
 g.add(mesh(new THREE.BoxGeometry(.52,.52,.3),top,0,.7,0),mesh(new THREE.SphereGeometry(.24,16,12),skin,0,1.22,0));
 const hc=mesh(new THREE.SphereGeometry(.255,16,12,0,Math.PI*2,0,Math.PI*.55),hair,0,1.24,.02);g.add(hc);
 if(o.longHair)g.add(mesh(new THREE.BoxGeometry(.46,.42,.12),hair,0,1.06,.17));
 if(o.hood){const hd=mesh(new THREE.SphereGeometry(.2,12,8,0,Math.PI*2,0,Math.PI*.5),top,0,.98,.2);hd.rotation.x=1.9;g.add(hd)}
 if(o.backpack)g.add(mesh(new THREE.BoxGeometry(.42,.48,.18),L(o.backpack),0,.72,.24));
 if(o.tie)g.add(mesh(new THREE.BoxGeometry(.07,.3,.02),L(0xc0392b),0,.78,-.16));
 if(o.bag){const bg=mesh(new THREE.BoxGeometry(.32,.24,.1),L(o.bag),0,-.56,0);w[3][0].add(bg)}
 if(o.book){w[1][0].add(mesh(new THREE.BoxGeometry(.06,.3,.24),L(o.book),.07,-.3,0))}
 if(o.laptop){w[1][0].add(mesh(new THREE.BoxGeometry(.04,.26,.36),L(0x9aa3b5),.08,-.28,0))}
 return {g,w}}

const STORIES={
prof:{name:'Professor',env:'campus',icon:'💰',item:'funding grants',intro:'Dodge major revisions and Reviewer 2<br>and grab every grant on the way',over:'Keep going!',
 char:()=>human({top:0x7a5a3a,bottom:0x3b3f4a,hair:0xd5d5d5,glasses:true,book:0x8e2b2b}),
 make(){return {low:()=>labelBox(1.4,.8,.9,0xf5f2e8,'Major Revision',0xf5f2e8,0xd63031,60),tall:()=>gate(0x5b5f6b,'Reviewer 2',0xd63031,0xffffff,0xffffff),item:()=>coin('$',0xffd23f,0x9a6b00)}}},
worker:{name:'Office Worker',env:'cbd',icon:'💵',item:'overtime paychecks',intro:'Dodge urgent meetings and overtime<br>and collect your overtime pay',over:'Keep going!',
 char:()=>human({top:0xf4f6fb,bottom:0x23252d,hair:0x1e1e22,tie:true,bag:0x3b2a1e}),
 make(){return {low:()=>labelBox(1.4,.8,.9,0x2d3448,'Urgent Meeting',0x2d3448,0x22e6ff,44),tall:()=>gate(0x2b3048,'Overtime Tonight',0xff2d55,0xffffff,0xff3cc8),item:()=>sheet(.62,.32,'¥',0x2bb673,0xeafff3,60)}}},
phd:{name:'PhD Student',env:'mountain',icon:'📄',item:'acceptances',intro:'Dodge failed experiments and rejections<br>and collect acceptances across the mountains',over:'Keep going!',
 char:()=>human({top:0x4a6fa5,bottom:0x2f3540,hair:0x2a1d16,hood:true,backpack:0xe67e22}),
 make(){return {low:()=>labelBox(1.4,.8,.9,0x8b6b4a,'Failed Experiment',0xf3ead8,0x2d6cdf,44),tall:()=>gate(0x6b5136,'Reject',0xd63031,0xffffff,0xe8dcc0),item:()=>sheet(.44,.58,'Accept',0xffffff,0x1f9d55,52)}}},
founder:{name:'Founder',env:'empire',icon:'📈',item:'funding rounds',intro:'Dodge prod bugs and investor passes<br>and close every round on the way',over:'Keep going!',
 char:()=>human({top:0x15161b,bottom:0x2c3e66,hair:0x1a1a1a,longHair:true,laptop:true}),
 make(){return {low:()=>labelBox(1.4,.8,.9,0x2d3448,'Prod Bug',0x2d3448,0xff3cc8,44),tall:()=>gate(0x2b3048,'Pass',0xff2d55,0xffffff,0x22e6ff),item:()=>coin('VC',0xffc94d,0x6b3fa0)}}},
free:{name:'Free Play'}
};
let mode='prof',cur=null;
function applyMode(){if(mode==='free'){setEnv(envKey);setChar(charKey);cur={low:env.low,tall:env.tall,item:()=>emojiSprite(ENVS[envKey].icon),icon:ENVS[envKey].icon,item_name:ENVS[envKey].item,over:'Ouch!'}}
 else{const st=STORIES[mode];setEnv(st.env);const x=player?player.g.position.x:0;if(player)scene.remove(player.g);player=st.char();player.g.position.x=x;scene.add(player.g);setGlow();const f=st.make();cur={...f,item:()=>st.label?labelSprite(st.icon,st.label):emojiSprite(st.icon),icon:st.icon,overEmoji:'💪',item_name:st.item,over:st.over}}hud()}

let envKey='empire',charKey='mouse',env=null,envGroup=null,player=null,pGlow=null;
function setEnv(k){envKey=k;if(envGroup)scene.remove(envGroup);clearObjs();env=ENVS[k].build();envGroup=env.g;if(!env.bloom)envGroup.traverse(o=>{if(o.isLight)o.intensity*=.68});scene.add(envGroup);scene.background.set(env.bg);scene.fog.color.set(env.fog[0]);scene.fog.near=env.fog[1];scene.fog.far=env.fog[2];setGlow();hud()}
function setChar(k){charKey=k;const x=player?player.g.position.x:0;if(player)scene.remove(player.g);player=CHARS[k].build();player.g.position.x=x;scene.add(player.g);setGlow()}
function setGlow(){if(!player||!env)return;if(pGlow){pGlow.parent&&pGlow.parent.remove(pGlow);pGlow=null}if(env.glow){pGlow=new THREE.PointLight(env.glow,1.3,7);pGlow.position.set(0,1.2,0);player.g.add(pGlow)}}

let objs=[];
function clearObjs(){for(const o of objs)scene.remove(o.m);objs=[]}
function addObj(type,lane,z,y){const m=type==='cheese'?cur.item():type==='crate'?cur.low():cur.tall();m.position.set(LANES[lane],type==='cheese'?(y||.7):0,z);m.userData.y0=m.position.y;scene.add(m);objs.push({type,m,got:false})}
function spawnRow(z){
 const blocked=Math.random()<(dist>350?.45:.2)?2:1;const ls=[0,1,2].sort(()=>Math.random()-.5);
 const bl=ls.slice(0,blocked),free=ls.slice(blocked);let crateLane=-1;
 for(const l of bl){const t=Math.random()<.6?'crate':'wall';addObj(t,l,z);if(t==='crate')crateLane=l}
 if(crateLane>=0&&Math.random()<.5){for(let k=-2;k<=2;k++)addObj('cheese',crateLane,z+k*1.2,1.6-Math.abs(k)*.25)}
 else{const l=free[Math.floor(Math.random()*free.length)];for(let k=1;k<=5;k++)addObj('cheese',l,z+k*1.6+2)}
}

let state='menu',speed=9,dist=0,cheese=0,lives=3,lane=1,py=0,vy=0,inv=0,spawnIn=6,shake=0,runT=0;
function reset(){clearObjs();speed=9;dist=0;cheese=0;lives=3;lane=1;py=0;vy=0;inv=0;spawnIn=6;shake=0;runT=0;if(player)player.g.position.set(0,0,0);hud()}
function hud(){if(!env||!cur)return;document.getElementById('hc').textContent=cur.icon+' '+cheese;document.getElementById('hd').textContent=Math.floor(dist)+' m';document.getElementById('hl').textContent='❤️'.repeat(Math.max(0,lives))||'💔'}

const ov=document.getElementById('ov');
function chips(id,obj,cur,fn){const el=document.getElementById(id);el.innerHTML='';for(const k in obj){const b=document.createElement('button');b.textContent=obj[k].name;if(k===cur)b.className='on';b.addEventListener('click',()=>{fn(k);chips(id,obj,k,fn)});el.appendChild(b)}}
function showMenu(){state='menu';stopScream();reset();ov.style.display='flex';
 const st=STORIES[mode];
 ov.innerHTML='<h2>3D Runner</h2><div class="lab">Pick a story</div><div class="chips" id="cm"></div>'+(mode==='free'?'<div class="lab">Pick a scene</div><div class="chips" id="cs"></div><div class="lab">Pick a character</div><div class="chips" id="cc"></div>':'<p style="margin:8px 0 0">'+st.intro+'</p>')+'<button class="go" id="start">Start</button>';
 chips('cm',STORIES,mode,k=>{mode=k;applyMode();showMenu()});
 if(mode==='free'){chips('cs',ENVS,envKey,k=>{setEnv(k);applyMode()});chips('cc',CHARS,charKey,k=>{setChar(k);applyMode()})}
 document.getElementById('start').addEventListener('click',startGame)}
function startGame(){reset();state='play';ov.style.display='none';playScream()}
function gameOver(){state='over';stopScream();ov.style.display='flex';ov.innerHTML=`<div class="big">${cur.overEmoji||'😵'}</div><h2>${cur.over}</h2><p>You ran ${Math.floor(dist)} m and collected ${cheese} ${cur.item_name}</p><button class="go" id="again">Play again</button><button class="go2" id="menu">Change story</button>`;
 document.getElementById('again').addEventListener('click',startGame);document.getElementById('menu').addEventListener('click',showMenu)}

function move(d){if(state==='play')lane=Math.max(0,Math.min(2,lane+d))}
function jump(){if(state==='play'&&py<=0.001)vy=8.6}
function drop(){if(state==='play'&&py>0)vy=-14}
for(const ev of ['touchstart','touchmove'])document.addEventListener(ev,e=>{if(e.cancelable&&!(e.target.closest&&(e.target.closest('.ov button')||e.target.closest('#shotwrap'))))e.preventDefault()},{passive:false});
const inShot=e=>e.target.closest&&e.target.closest('#shotwrap');
document.addEventListener('contextmenu',e=>{if(!inShot(e))e.preventDefault()});
document.addEventListener('selectstart',e=>{if(!inShot(e))e.preventDefault()});
for(const [id,fn] of [['bl',()=>move(-1)],['br',()=>move(1)],['bj',jump]]){const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');fn()});
 for(const ev of ['pointerup','pointercancel','pointerleave'])el.addEventListener(ev,()=>el.classList.remove('on'))}
let sx=0,sy=0,sw=false;
box.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;sw=true});
box.addEventListener('pointermove',e=>{if(!sw)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>28){sw=false;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();else drop()}});
box.addEventListener('pointerup',()=>{sw=false});
addEventListener('keydown',e=>{const k=e.code;if(k==='ArrowLeft'||k==='KeyA')move(-1);else if(k==='ArrowRight'||k==='KeyD')move(1);else if(k==='ArrowUp'||k==='KeyW'||k==='Space'){e.preventDefault();jump()}else if(k==='ArrowDown'||k==='KeyS')drop()});
function hit(){if(inv>0)return;lives--;inv=1.6;shake=.35;hud();if(lives<=0)gameOver()}


let collaging=false;
function makeCollage(){
 collaging=true;stopScream();ov.style.display='none';
 const TW=360,TH=450,G=0,COLS=4,ROWS=2,cv=document.createElement('canvas');cv.width=COLS*TW+(COLS+1)*G;cv.height=ROWS*TH+(ROWS+1)*G;const cx=cv.getContext('2d');cx.fillStyle='#e4e4e8';cx.fillRect(0,0,cv.width,cv.height);
 const cfg=[['prof',null,null,'Professor'],['worker',null,null,'Office Worker'],['phd',null,null,'PhD Student'],['founder',null,null,'Founder'],['free','town','mouse','Sunny Town'],['free','snow','penguin','Snow Kingdom'],['free','candy','cat','Candy Land'],['free','empire','robot','Tech Empire']];
 const pr=renderer.getPixelRatio();renderer.setPixelRatio(1);
 cfg.forEach(([m,e,c,label],i)=>{
  mode=m;if(m==='free'){envKey=e;charKey=c}applyMode();reset();state='play';lane=1;
  for(let k=0;k<5;k++)addObj('cheese',1,-4-k*1.5);addObj('crate',0,-9);addObj('wall',2,-13);addObj('wall',0,-24);addObj('crate',2,-24);for(let k=0;k<4;k++)addObj('cheese',1,-28-k*1.5);
  for(const d of env.deco){d.position.z+=3;if(d.position.z>10)d.position.z-=WRAP}if(env.update)env.update(.016,1,0);
  const pg=player.g;pg.position.set(0,.06,0);pg.rotation.set(0,0,0);pg.visible=true;
  for(const [o,ax,amp,spd,ph] of player.w){const r0=o.userData.r0??(o.userData.r0=o.rotation[ax]);o.rotation[ax]=r0+Math.sin(.35*spd+(ph||0))*amp}
  camera.aspect=TW/TH;camera.updateProjectionMatrix();camera.position.set(0,4.3,6.8);camera.lookAt(0,.9,-7);
  renderer.setSize(TW,TH,false);
  if(composer&&env.bloom){composer.setSize(TW,TH);bloom.resolution.set(TW/2,TH/2);composer.render()}else renderer.render(scene,camera);
  const x=G+(i%COLS)*(TW+G),y=G+Math.floor(i/COLS)*(TH+G);cx.drawImage(renderer.domElement,0,0,renderer.domElement.width,renderer.domElement.height,x,y,TW,TH);
  cx.font='bold 20px Arial,sans-serif';const w=cx.measureText(label).width+24;cx.fillStyle='rgba(0,0,0,.55)';cx.fillRect(x+12,y+TH-46,w,32);cx.fillStyle='#fff';cx.textBaseline='middle';cx.fillText(label,x+24,y+TH-30);
 });
 renderer.setPixelRatio(pr);clearObjs();mode='prof';applyMode();resize();collaging=false;showMenu();
 const wrap=document.createElement('div');wrap.id='shotwrap';wrap.style.cssText='position:fixed;inset:0;z-index:99;background:#0b0b12;overflow:auto;padding:14px;text-align:center;color:#fff;font:14px Arial,sans-serif';
 wrap.innerHTML='<div style="margin-bottom:10px">Long-press or right-click the image to save it</div>';const img=new Image();img.src=cv.toDataURL('image/png');img.style.cssText='width:100%;max-width:1440px;border-radius:8px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto';wrap.appendChild(img);
 const b=document.createElement('button');b.textContent='Close';b.style.cssText='display:block;margin:14px auto;padding:10px 26px;border-radius:999px;border:none;background:#ff7a45;color:#fff;font-size:15px';b.addEventListener('click',()=>wrap.remove());wrap.appendChild(b);document.body.appendChild(wrap);
}
setEnv(envKey);setChar(charKey);applyMode();showMenu();
if(location.hash==='#collage')setTimeout(makeCollage,600);
const clock=new THREE.Clock();
function tick(){
 if(collaging){requestAnimationFrame(tick);return}
 const dt=Math.min(clock.getDelta(),.05),t=performance.now()/1000;
 const running=state==='play';
 const dz=running?(speed=Math.min(23,9+(runT+=dt)*.22))*dt:(state==='menu'?4*dt:0);
 if(dz){dist+=running?dz:0;if(env.scroll)env.scroll(dz);for(const d of env.deco){d.position.z+=dz;if(d.position.z>10)d.position.z-=WRAP}}
 if(env.update)env.update(dt,t,dz);
 if(running){
  spawnIn-=dz;if(spawnIn<=0){spawnRow(-85);spawnIn=10+Math.random()*5-(speed-9)*.12}
  vy-=24*dt;py=Math.max(0,py+vy*dt);if(py===0&&vy<0)vy=0;
  const px=player.g.position.x;
  for(const o of objs){o.m.position.z+=dz;const oz=o.m.position.z;
   if(o.type==='cheese'){o.m.rotation.y+=dt*3;o.m.position.y=o.m.userData.y0+Math.sin(t*4+oz)*.06;if(!o.got&&Math.abs(o.m.position.x-px)<.8&&Math.abs(oz)<.7&&Math.abs(o.m.position.y-(py+.6))<.9){o.got=true;o.m.visible=false;cheese++;playEat();hud()}}
   else if(Math.abs(o.m.position.x-px)<.95){if(o.type==='crate'&&Math.abs(oz)<.75&&py<.72)hit();else if(o.type==='wall'&&Math.abs(oz)<.45)hit()}}
  objs=objs.filter(o=>{if(o.m.position.z>12){scene.remove(o.m);return false}return true});
  if(inv>0)inv-=dt;hud();
 }
 const pg=player.g,tx=LANES[lane];pg.position.x+=(tx-pg.position.x)*Math.min(1,dt*12);
 const moving=state!=='over';
 pg.position.y=py+(moving&&py===0?Math.abs(Math.sin(t*14))*.08:0);
 pg.rotation.y+=((state==='menu'?Math.PI+Math.sin(t*.8)*.5:0)-pg.rotation.y)*Math.min(1,dt*5);pg.rotation.z=(pg.position.x-tx)*.25;pg.rotation.x=running&&py>0?-.25:0;
 for(const [o,ax,amp,spd,ph] of player.w)o.rotation[ax]=(o.userData.r0??(o.userData.r0=o.rotation[ax]))+Math.sin(t*spd+(ph||0))*amp*(moving?1:.3);
 pg.visible=!(inv>0&&Math.floor(inv*12)%2);
 if(shake>0)shake-=dt;const sh=shake>0?shake*.5:0;
 camera.position.set(pg.position.x*.55+(Math.random()-.5)*sh,4.3+(Math.random()-.5)*sh,6.8);
 camera.lookAt(pg.position.x*.4,.9,-7);
 if(composer&&env.bloom)composer.render();else renderer.render(scene,camera);
 requestAnimationFrame(tick);
}
tick();
</script>
