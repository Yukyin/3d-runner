<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D Runner</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;margin:0;background:#16161f;color:#fff;font-family:-apple-system,"PingFang SC",Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:10px 10px 0}
#game{position:relative;width:100%;border-radius:16px;overflow:hidden;touch-action:none;background:#222}
#game canvas{display:block}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 52%,rgba(0,0,0,.42) 100%)}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:10px 14px;font-size:16px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,15,30,.5);text-align:center;padding:16px}
.ov .big{font-size:52px;line-height:1.1}
.ov h2{font-size:22px;margin:4px 0 10px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.ov p{font-size:15px;margin:0 0 16px;line-height:1.6}
.lab{font-size:13px;opacity:.85;margin:6px 0 6px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;max-width:330px;margin-bottom:6px}
.chips button{font-size:15px;padding:10px 6px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:rgba(20,20,40,.55);color:#fff;cursor:pointer}
.chips button.on{border-color:#ff7a45;background:rgba(255,122,69,.85)}
.go{margin-top:12px;font-size:18px;font-weight:600;padding:13px 44px;border:none;border-radius:999px;background:#ff7a45;color:#fff;cursor:pointer}
.go2{margin-top:10px;font-size:15px;padding:10px 26px;border:1.5px solid rgba(255,255,255,.5);border-radius:999px;background:rgba(20,20,40,.5);color:#fff;cursor:pointer}
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:12px}
.pad button{width:78px;height:78px;border-radius:50%;border:none;background:#34343f;touch-action:none;display:flex;align-items:center;justify-content:center}
.pad button.on{background:#ff7a45}
#bj{width:92px;height:92px;background:#ff7a45}
#bj.on{background:#ffb08c}
.pad svg{width:30px;height:30px;fill:#fff;pointer-events:none}
.hint{font-size:12px;color:#9a9aa8;text-align:center;margin-top:8px}
</style>
</head>

</div>
<div class="pad">

 <button id="br" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M8 4l10 8-10 8z"/></svg></button>
</div>
<div class="hint">Swipe left or right to switch lanes, swipe up to jump. Arrow keys work on a computer.</div>
</div>

 const st=STORIES[mode];
 ov.innerHTML='<h2>3D Runner</h2><div class="lab">Pick a story</div><div class="chips" id="cm"></div>'+(mode==='free'?'<div class="lab">Pick a scene</div><div class="chips" id="cs"></div><div class="lab">Pick a character</div><div class="chips" id="cc"></div>':'<p style="margin:8px 0 0">'+st.intro+'</p>')+'<button class="go" id="start">Start</button>';
 chips('cm',STORIES,mode,k=>{mode=k;applyMode();showMenu()});
 if(mode==='free'){chips('cs',ENVS,envKey,k=>{setEnv(k);applyMode()});chips('cc',CHARS,charKey,k=>{setChar(k);applyMode()})}
 document.getElementById('start').addEventListener('click',startGame)}
function startGame(){reset();state='play';ov.style.display='none';playScream()}
function gameOver(){state='over';stopScream();ov.style.display='flex';ov.innerHTML=`<div class="big">${cur.overEmoji||'😵'}</div><h2>${cur.over}</h2><p>You ran ${Math.floor(dist)} m and collected ${cheese} ${cur.item_name}</p><button class="go" id="again">Play again</button><button class="go2" id="menu">Change story</button>`;
 document.getElementById('again').addEventListener('click',startGame);document.getElementById('menu').addEventListener('click',showMenu)}

function move(d){if(state==='play')lane=Math.max(0,Math.min(2,lane+d))}
let airT=-1;
function jump(){if(state==='play'&&py<=0.001){vy=8.6;airT=0}}
function drop(){if(state==='play'&&py>0)vy=-14}
for(const ev of ['touchstart','touchmove'])document.addEventListener(ev,e=>{if(e.cancelable&&!(e.target.closest&&(e.target.closest('.ov button')||e.target.closest('#shotwrap'))))e.preventDefault()},{passive:false});
const inShot=e=>e.target.closest&&e.target.closest('#shotwrap');
document.addEventListener('contextmenu',e=>{if(!inShot(e))e.preventDefault()});
document.addEventListener('selectstart',e=>{if(!inShot(e))e.preventDefault()});
for(const [id,fn] of [['bl',()=>move(-1)],['br',()=>move(1)],['bj',jump]]){const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('on');fn()});
 for(const ev of ['pointerup','pointercancel','pointerleave'])el.addEventListener(ev,()=>el.classList.remove('on'))}
let sx=0,sy=0,sw=false;
box.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;sw=true});
box.addEventListener('pointermove',e=>{if(!sw)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>28){sw=false;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();else drop()}});
box.addEventListener('pointerup',()=>{sw=false});
addEventListener('keydown',e=>{const k=e.code;if(k==='ArrowLeft'||k==='KeyA')move(-1);else if(k==='ArrowRight'||k==='KeyD')move(1);else if(k==='ArrowUp'||k==='KeyW'||k==='Space'){e.preventDefault();jump()}else if(k==='ArrowDown'||k==='KeyS')drop()});
function hit(){if(inv>0)return;lives--;inv=1.6;shake=.35;hud();if(lives<=0)gameOver()}


const streaks=[];{const sg=new THREE.BoxGeometry(.03,.03,2.6);for(let i=0;i<46;i++){const m=new THREE.Mesh(sg,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false,fog:false}));const a=Math.random()*Math.PI,r=2.4+Math.random()*4;m.position.set(Math.cos(a)*r*(Math.random()<.5?-1:1),.4+Math.sin(a)*r,-Math.random()*60);scene.add(m);streaks.push(m)}}
let coastT=0;
const dust=(()=>{const n=420,pos=new Float32Array(n*3);for(let i=0;i<n;i++){pos[i*3]=(Math.random()-.5)*26;pos[i*3+1]=Math.random()*9;pos[i*3+2]=-Math.random()*70+8}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
 const p=new THREE.Points(g,new THREE.PointsMaterial({color:0xfff4e0,size:.07,transparent:true,opacity:.7,depthWrite:false}));scene.add(p);return p})();
let collaging=false;
function makeCollage(){
 collaging=true;stopScream();ov.style.display='none';
 const TW=360,TH=450,G=0,COLS=4,ROWS=2,cv=document.createElement('canvas');cv.width=COLS*TW+(COLS+1)*G;cv.height=ROWS*TH+(ROWS+1)*G;const cx=cv.getContext('2d');cx.fillStyle='#e4e4e8';cx.fillRect(0,0,cv.width,cv.height);
 const cfg=[['prof',null,null,'Professor'],['worker',null,null,'Office Worker'],['phd',null,null,'PhD Student'],['founder',null,null,'Founder'],['free','town','mouse','Sunny Town'],['free','snow','penguin','Snow Kingdom'],['free','candy','cat','Candy Land'],['free','grid','robot','Grid City']];
 const pr=renderer.getPixelRatio();renderer.setPixelRatio(1);
 cfg.forEach(([m,e,c,label],i)=>{
  mode=m;if(m==='free'){envKey=e;charKey=c}applyMode();reset();state='play';lane=1;
  for(let k=0;k<5;k++)addObj('cheese',1,-4-k*1.5);addObj('crate',0,-9);addObj('wall',2,-13);addObj('wall',0,-24);addObj('crate',2,-24);for(let k=0;k<4;k++)addObj('cheese',1,-28-k*1.5);
  for(const d of env.deco){d.position.z+=3;if(d.position.z>10)d.position.z-=WRAP}if(env.update)env.update(.016,1,0);
  const pg=player.g;pg.position.set(0,.06,0);pg.rotation.set(0,0,0);pg.visible=true;
  for(const [o,ax,amp,spd,ph] of player.w){const r0=o.userData.r0??(o.userData.r0=o.rotation[ax]);o.rotation[ax]=r0+Math.sin(.35*spd+(ph||0))*amp}
  camera.aspect=TW/TH;camera.updateProjectionMatrix();camera.position.set(0,4.3,6.8);camera.lookAt(0,.9,-7);
  renderer.setSize(TW,TH,false);
  if(composer&&env.bloom){composer.setSize(TW,TH);bloom.resolution.set(TW/2,TH/2);composer.render()}else renderer.render(scene,camera);
  const x=G+(i%COLS)*(TW+G),y=G+Math.floor(i/COLS)*(TH+G);cx.drawImage(renderer.domElement,0,0,renderer.domElement.width,renderer.domElement.height,x,y,TW,TH);
  cx.font='bold 20px Arial,sans-serif';const w=cx.measureText(label).width+24;cx.fillStyle='rgba(0,0,0,.55)';cx.fillRect(x+12,y+TH-46,w,32);cx.fillStyle='#fff';cx.textBaseline='middle';cx.fillText(label,x+24,y+TH-30);
 });
 renderer.setPixelRatio(pr);clearObjs();mode='prof';applyMode();resize();collaging=false;showMenu();
 const wrap=document.createElement('div');wrap.id='shotwrap';wrap.style.cssText='position:fixed;inset:0;z-index:99;background:#0b0b12;overflow:auto;padding:14px;text-align:center;color:#fff;font:14px Arial,sans-serif';
 wrap.innerHTML='<div style="margin-bottom:10px">Long-press or right-click the image to save it</div>';const img=new Image();img.src=cv.toDataURL('image/png');img.style.cssText='width:100%;max-width:1440px;border-radius:8px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto';wrap.appendChild(img);
 const b=document.createElement('button');b.textContent='Close';b.style.cssText='display:block;margin:14px auto;padding:10px 26px;border-radius:999px;border:none;background:#ff7a45;color:#fff;font-size:15px';b.addEventListener('click',()=>wrap.remove());wrap.appendChild(b);document.body.appendChild(wrap);
}
setEnv(envKey);setChar(charKey);applyMode();showMenu();
if(location.hash==='#collage')setTimeout(makeCollage,600);
const clock=new THREE.Clock();
function tick(){
 if(collaging){requestAnimationFrame(tick);return}
 const dt=Math.min(clock.getDelta(),.05),t=performance.now()/1000;
 const running=state==='play';
 const dz=running?(speed=Math.min(23,9+(runT+=dt)*.22))*dt:(state==='menu'?4*dt:0);
 if(dz){dist+=running?dz:0;if(env.scroll)env.scroll(dz);for(const d of env.deco){d.position.z+=dz;if(d.position.z>(d.isInstancedMesh?70:10))d.position.z-=WRAP}}
 if(env.update)env.update(dt,t,dz);
 if(running){
  spawnIn-=dz;if(spawnIn<=0){spawnRow(-85);spawnIn=10+Math.random()*5-(speed-9)*.12}
  vy-=24*dt;py=Math.max(0,py+vy*dt);if(py===0&&vy<0)vy=0;
  const px=player.g.position.x;
  for(const o of objs){o.m.position.z+=dz;const oz=o.m.position.z;
   if(o.type==='cheese'){o.m.rotation.y+=dt*3;o.m.position.y=o.m.userData.y0+Math.sin(t*4+oz)*.06;if(!o.got&&Math.abs(o.m.position.x-px)<.8&&Math.abs(oz)<.7&&Math.abs(o.m.position.y-(py+.6))<.9){o.got=true;o.m.visible=false;cheese++;playEat();hud()}}
   else if(Math.abs(o.m.position.x-px)<.95){if(o.type==='crate'&&Math.abs(oz)<.75&&py<.72)hit();else if(o.type==='wall'&&Math.abs(oz)<.45)hit()}}
  objs=objs.filter(o=>{if(o.m.position.z>12){scene.remove(o.m);return false}return true});
  if(inv>0)inv-=dt;hud();
 }
 GT.value=t;
 coastT+=(running?speed/9:.5)*dt;
 const bx=.0034*Math.sin(coastT*.21)+.0016*Math.sin(coastT*.57+1.3),by=.0024*Math.sin(coastT*.29+.6)+.0012*Math.sin(coastT*.83);
 BEND.value.set(bx,by);
 const dive=Math.max(0,-by/.0036),speedK=running?(speed-9)/14:0;
 const fov=62+speedK*14+dive*12;if(Math.abs(camera.fov-fov)>.05){camera.fov=fov;camera.updateProjectionMatrix()}
 {const a=dust.geometry.attributes.position,arr=a.array;for(let i=0;i<arr.length;i+=3){arr[i+2]+=(dz||0)+dt*.3;arr[i+1]+=Math.sin(t*.7+i)*.002;if(arr[i+2]>8)arr[i+2]-=78}a.needsUpdate=true}
 for(const m of streaks){m.position.z+=(dz||0)*2.6;if(m.position.z>8)m.position.z-=68;m.material.opacity=running?Math.min(.55,.08+speedK*.4+dive*.25):0}
 const pg=player.g,tx=LANES[lane];pg.position.x+=(tx-pg.position.x)*Math.min(1,dt*12);
 const moving=state!=='over';
 pg.position.y=py+(moving&&py===0?Math.abs(Math.sin(t*14))*.08:0);
 pg.rotation.y+=((state==='menu'?Math.PI+Math.sin(t*.8)*.5:0)-pg.rotation.y)*Math.min(1,dt*5);pg.rotation.z=(pg.position.x-tx)*.25;if(running&&py>0&&airT>=0){airT+=dt;const th=-Math.min(1,airT/.7)*Math.PI*2;pg.rotation.x=th;pg.position.y+=.85-.85*Math.cos(th);pg.position.z=-.85*Math.sin(th)}else{airT=-1;pg.rotation.x=0;pg.position.z=0}
 for(const [o,ax,amp,spd,ph] of player.w)o.rotation[ax]=(o.userData.r0??(o.userData.r0=o.rotation[ax]))+Math.sin(t*spd+(ph||0))*amp*(moving?1:.3);
 pg.visible=!(inv>0&&Math.floor(inv*12)%2);
 if(shake>0)shake-=dt;const sh=shake>0?shake*.5:0;
 camera.position.set(pg.position.x*.6+(Math.random()-.5)*sh,3.3+(Math.random()-.5)*sh,5.8);
 camera.lookAt(pg.position.x*.45,1.3-by*260,-8);camera.rotateZ(-bx*38);
 if(composer&&env.bloom)composer.render();else renderer.render(scene,camera);
 requestAnimationFrame(tick);
}
tick();
</script>
